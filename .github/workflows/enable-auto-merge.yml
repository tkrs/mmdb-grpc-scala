name: enable-auto-merge

on:
  pull_request:
    # types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: enable-auto-merge
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || startsWith(github.ref_name, 'update/')
    steps:
      - uses: actions/checkout@v4
      - run: gh pr merge --auto --merge ${{github.event.number}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
